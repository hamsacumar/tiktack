<!-- login.component.html -->
<div class="auth-page">
  <!-- Spline 3D Background -->
  <div class="spline-background">
    <iframe src="https://my.spline.design/robotarm-FIuMuDJqugF9qd0CnFg6OXkf/" title="3D robot arm"
      allowfullscreen>
    </iframe>
  </div>

  <div class="auth-overlay">
    <form class="auth-card glass-card" (ngSubmit)="login()">
      <div class="auth-brand"><span class="x">X</span><span class="o">O</span> Tic Tac Toe</div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to jump into a match.</p>

      <div class="alert error" *ngIf="errorMsg" role="alert">{{ errorMsg }}</div>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" class="form-control" autocomplete="username"
               [(ngModel)]="username" placeholder="Enter your username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" class="form-control" autocomplete="current-password"
               [(ngModel)]="password" placeholder="Enter your password" required />
      </div>

      <button type="submit" class="btn-primary" [disabled]="!username || !password">
        Play
      </button>

      <p class="auth-footer">Don't have an account? <a routerLink="/register">Register here</a></p>
    </form>
  </div>
</div>
