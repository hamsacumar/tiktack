<div class="game-page">
  <header class="game-header">
    <h1 class="game-title"><span class="x">X</span><span class="o">O</span> Tic Tac Toe</h1>

    <div class="status glass-card" *ngIf="!winner">
      Current Player:
      <span class="badge" [class.x]="player === 'X'" [class.o]="player === 'O'">{{ player }}</span>
    </div>

    <h2 class="status glass-card winner" *ngIf="winner">
      Player
      <span class="badge" [class.x]="winner === 'X'" [class.o]="winner === 'O'">{{ winner }}</span>
      won the game!
    </h2>
  </header>

  <div class="center">
    <div class="spline-background">
      <iframe
        src="https://my.spline.design/genkubgreetingrobot-MLFiG9z2t6aFNeE1tuK8aPr7/"
        title="3D greeting robot"
        allowfullscreen>
      </iframe>
    </div>

    <div class="board-panel glass-card">
      <div class="board">
        <div *ngFor="let row of grid; let rowIndex = index" class="row">
          <app-square *ngFor="let val of row; let colIndex = index"
              [value]="val"
              (click)="makeMove(rowIndex, colIndex)">
          </app-square>
        </div>
      </div>

      <button type="button" class="btn-primary new-game" (click)="newGame()">Start new Game</button>
    </div>
  </div>
</div>
