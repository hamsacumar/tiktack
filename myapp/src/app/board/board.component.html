<h1 class="status">
  Current Player:
  <span class="player-badge" [class.x]="player === 'X'" [class.o]="player === 'O'">{{ player }}</span>
</h1>

<div class="center">

  <div class="spline-background">
    <iframe
      src="https://my.spline.design/genkubgreetingrobot-MLFiG9z2t6aFNeE1tuK8aPr7/"
      frameborder="0"
      width="100%"
      height="100%"
      allowfullscreen>
    </iframe>
  </div>

  <div class="board">
    <div *ngFor="let row of grid; let rowIndex = index" class="row">
      <app-square *ngFor="let val of row; let colIndex = index"
        [value]="val"
        (click)="makeMove(rowIndex, colIndex)">
      </app-square>
    </div>
  </div>

</div>

<h2 *ngIf="winner" class="winner">
  Player {{ winner }} won the game!
</h2>

<button class="new-game" (click)="newGame()">Start new Game</button>
