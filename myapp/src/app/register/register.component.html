<!-- register.component.html -->
<div class="auth-page">
  <!-- Spline 3D Background -->
  <div class="spline-background">
    <iframe src="https://my.spline.design/robotarm-FIuMuDJqugF9qd0CnFg6OXkf/" title="3D robot arm"
      allowfullscreen>
    </iframe>
  </div>

  <div class="auth-overlay">
    <form class="auth-card glass-card" (ngSubmit)="register()">
      <div class="auth-brand"><span class="x">X</span><span class="o">O</span> Tic Tac Toe</div>
      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Join in and challenge a friend.</p>

      <div class="alert error" *ngIf="errorMsg" role="alert">{{ errorMsg }}</div>
      <div class="alert success" *ngIf="successMsg" role="status">{{ successMsg }}</div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" class="form-control" autocomplete="email"
               [(ngModel)]="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label for="userName">Username</label>
        <input type="text" name="userName" id="userName" class="form-control" autocomplete="username"
               [(ngModel)]="userName" placeholder="Pick a username" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" class="form-control" autocomplete="new-password"
               [(ngModel)]="password" placeholder="Create a password" required />
      </div>

      <button type="submit" class="btn-primary" [disabled]="!userName || !password || !email">
        Register
      </button>

      <p class="auth-footer">Already have an account? <a routerLink="/login">Login here</a></p>
    </form>
  </div>
</div>
